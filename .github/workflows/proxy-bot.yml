name: Proxy Bot

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-proxy-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 python-telegram-bot
        
    - name: Run Proxy Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        TARGET_CHAT: ${{ secrets.TARGET_CHAT }}
      run: |
        python proxy_bot.py
        
    - name: Upload state file
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: state-file
        path: last_messages.json
        retention-days: 7
